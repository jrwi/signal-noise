[project]
name = "signal-noise"
version = "0.1.0"
description = "A learning-first Spotify listening-history data pipeline"
requires-python = ">=3.12"
dependencies = [
    "spotipy>=2.25",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
