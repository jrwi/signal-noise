[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-noise"
version = "0.1.0"
description = "A learning-first Spotify listening-history data pipeline"
requires-python = ">=3.12"
dependencies = [
    "spotipy>=2.25",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
